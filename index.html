<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Daily Ops · WhatsApp Report Builder</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }
        body {
            background: #e9eef4;
            display: flex;
            justify-content: center;
            padding: 24px 16px;
        }
        .app-container {
            max-width: 1100px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            justify-content: center;
        }

        .form-card {
            flex: 1 1 440px;
            background: white;
            border-radius: 28px;
            padding: 24px 22px;
            box-shadow: 0 10px 28px rgba(0,0,0,0.08);
            height: fit-content;
        }
        .form-card h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #0b2a3b;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-card h2 i {
            color: #2a7f6e;
        }
        .field-group {
            margin-bottom: 14px;
        }
        .field-group label {
            display: block;
            font-weight: 500;
            font-size: 0.8rem;
            color: #1f4157;
            margin-bottom: 3px;
            letter-spacing: -0.2px;
            opacity: 0.8;
        }
        .field-group input,
        .field-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d3dee9;
            border-radius: 14px;
            font-size: 0.9rem;
            background: #fafcff;
            transition: 0.2s;
        }
        .field-group input:focus,
        .field-group textarea:focus {
            border-color: #2a7f6e;
            outline: none;
            background: white;
            box-shadow: 0 0 0 3px rgba(42,127,110,0.1);
        }
        .field-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .field-group .unit-hint {
            font-size: 0.7rem;
            color: #7d97ad;
            margin-top: 2px;
            padding-left: 4px;
        }
        .row2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .btn-generate {
            background: #1d4b5e;
            color: white;
            border: none;
            padding: 14px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            margin-top: 6px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-generate:hover {
            background: #0f3a4a;
            transform: scale(0.98);
        }
        .btn-generate i {
            font-size: 1.1rem;
        }

        .preview-card {
            flex: 1 1 440px;
            background: #f0f4fa;
            border-radius: 28px;
            padding: 18px 16px 20px;
            box-shadow: 0 10px 28px rgba(0,0,0,0.06);
            height: fit-content;
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }
        .preview-header span {
            font-weight: 600;
            color: #1a3a4a;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .preview-header span i {
            color: #25D366;
        }
        .preview-header small {
            background: #d3dee9;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #1f4157;
        }
        .whatsapp-msg {
            background: white;
            border-radius: 22px;
            padding: 20px 18px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.04);
            border: 1px solid #e2e9f2;
            font-size: 0.92rem;
            line-height: 1.6;
            color: #1d2f3d;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 620px;
            overflow-y: auto;
            min-height: 200px;
        }
        .whatsapp-msg strong {
            color: #003153;
        }
        .whatsapp-msg .empty-state {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 40px 0;
        }
        .copy-btn {
            background: #25D366;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            width: 100%;
            margin-top: 16px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .copy-btn:hover {
            background: #1da85c;
        }
        .copy-btn.copied {
            background: #2a7f6e;
        }
        .footer-hint {
            text-align: right;
            font-size: 0.7rem;
            color: #7d97ad;
            margin-top: 10px;
        }
        .clear-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }
        .clear-btn:hover {
            background: #c0392b;
            transform: scale(0.97);
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }
        .btn-group .btn-generate {
            margin-top: 0;
            flex: 1;
        }

        @media (max-width: 700px) {
            .app-container {
                flex-direction: column;
                align-items: center;
            }
            .form-card,
            .preview-card {
                flex: 1 1 100%;
            }
            .row2 {
                grid-template-columns: 1fr;
            }
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">

        <div class="form-card">
            <h2><i class="fas fa-pen-fancy"></i> Daily Report Editor</h2>
            <form id="reportForm">

                <div class="field-group">
                    <label><i class="far fa-calendar-alt"></i> Date</label>
                    <input type="text" id="dateInput" placeholder="e.g. 23-07-2026" />
                </div>
                <div class="field-group">
                    <label><i class="fas fa-hard-hat"></i> Greeting</label>
                    <input type="text" id="greetingInput" placeholder="e.g. Good Morning Sir" />
                </div>

                <!-- Mine Ops: only numbers -->
                <div class="row2">
                    <div class="field-group">
                        <label><i class="fas fa-oil-can"></i> Compressors</label>
                        <input type="text" id="compressors" placeholder="e.g. 10" />
                    </div>
                    <div class="field-group">
                        <label><i class="fas fa-bolt"></i> Holes</label>
                        <input type="text" id="holes" placeholder="e.g. 713" />
                    </div>
                </div>
                <div class="row2">
                    <div class="field-group">
                        <label><i class="fas fa-ruler"></i> Feetage</label>
                        <input type="text" id="feetage" placeholder="e.g. 3891" />
                    </div>
                    <div class="field-group">
                        <label><i class="fas fa-weight-hanging"></i> Production FTD</label>
                        <input type="text" id="prodFtd" placeholder="e.g. 3113" />
                        <div class="unit-hint">MT</div>
                    </div>
                </div>
                <div class="field-group">
                    <label><i class="fas fa-chart-line"></i> Production MTD</label>
                    <input type="text" id="prodMtd" placeholder="e.g. 20096" />
                    <div class="unit-hint">MT</div>
                </div>

                <!-- Today planning -->
                <div class="field-group">
                    <label><i class="fas fa-clipboard-list"></i> Today Planning (next day)</label>
                    <input type="text" id="todayPlan" placeholder="Compressors : 08 Nos · Holes : 480 · Feetage : 2600" />
                </div>

                <!-- Boulders -->
                <div class="row2">
                    <div class="field-group">
                        <label><i class="fas fa-truck-loading"></i> Boulders Trips</label>
                        <input type="text" id="boulderTrips" placeholder="e.g. 59" />
                    </div>
                    <div class="field-group">
                        <label><i class="fas fa-weight-hanging"></i> Boulders FTD</label>
                        <input type="text" id="boulderFtd" placeholder="e.g. 1347" />
                        <div class="unit-hint">MT</div>
                    </div>
                </div>
                <div class="field-group">
                    <label><i class="fas fa-calendar-alt"></i> Boulders MTD</label>
                    <input type="text" id="boulderMtd" placeholder="e.g. 27973" />
                    <div class="unit-hint">MT</div>
                </div>

                <!-- Plant production -->
                <div class="row2">
                    <div class="field-group">
                        <label><i class="fas fa-industry"></i> Plant Trips FTD</label>
                        <input type="text" id="plantTripsFtd" placeholder="e.g. 67" />
                    </div>
                    <div class="field-group">
                        <label><i class="fas fa-industry"></i> Plant FTD</label>
                        <input type="text" id="plantFtd" placeholder="e.g. 1565" />
                        <div class="unit-hint">MT</div>
                    </div>
                </div>
                <div class="row2">
                    <div class="field-group">
                        <label><i class="fas fa-industry"></i> Plant MTD</label>
                        <input type="text" id="plantMtd" placeholder="e.g. 28300" />
                        <div class="unit-hint">MT</div>
                    </div>
                    <div class="field-group">
                        <label><i class="fas fa-tachometer-alt"></i> TPH</label>
                        <input type="text" id="plantTph" placeholder="e.g. 170" />
                    </div>
                </div>

                <!-- Dispatch -->
                <div class="row2">
                    <div class="field-group">
                        <label><i class="fas fa-shipping-fast"></i> Dispatch FTD</label>
                        <input type="text" id="dispatchFtd" placeholder="e.g. 45" />
                        <div class="unit-hint">MT</div>
                    </div>
                    <div class="field-group">
                        <label><i class="fas fa-shipping-fast"></i> Dispatch MTD</label>
                        <input type="text" id="dispatchMtd" placeholder="e.g. 16524" />
                        <div class="unit-hint">MT</div>
                    </div>
                </div>

                <!-- Revenue -->
                <div class="row2">
                    <div class="field-group">
                        <label><i class="fas fa-coins"></i> Basic FTD</label>
                        <input type="text" id="basicFtd" placeholder="e.g. .03" />
                        <div class="unit-hint">L</div>
                    </div>
                    <div class="field-group">
                        <label><i class="fas fa-coins"></i> Basic MTD</label>
                        <input type="text" id="basicMtd" placeholder="e.g. 66.6" />
                        <div class="unit-hint">L</div>
                    </div>
                </div>
                <div class="row2">
                    <div class="field-group">
                        <label><i class="fas fa-money-bill-wave"></i> Total FTD</label>
                        <input type="text" id="totalFtd" placeholder="e.g. .03" />
                        <div class="unit-hint">L</div>
                    </div>
                    <div class="field-group">
                        <label><i class="fas fa-money-bill-wave"></i> Total MTD</label>
                        <input type="text" id="totalMtd" placeholder="e.g. 107.4" />
                        <div class="unit-hint">L</div>
                    </div>
                </div>

                <!-- Royalty -->
                <div class="field-group">
                    <label><i class="fas fa-gavel"></i> Royalty</label>
                    <input type="text" id="royalty" placeholder="e.g. -33097" />
                    <div class="unit-hint">MT</div>
                </div>

                <!-- Remarks -->
                <div class="field-group">
                    <label><i class="fas fa-comment-dots"></i> Remarks</label>
                    <textarea id="remarksInput" rows="2" placeholder="Enter your remarks here..."></textarea>
                </div>

                <div class="btn-group">
                    <button type="button" class="btn-generate" id="generateBtn"><i class="fas fa-sync-alt"></i> Generate Preview</button>
                    <button type="button" class="clear-btn" id="clearBtn"><i class="fas fa-eraser"></i> Clear All</button>
                </div>
            </form>
        </div>

        <div class="preview-card">
            <div class="preview-header">
                <span><i class="fab fa-whatsapp"></i> WhatsApp Preview</span>
                <small><i class="far fa-copy"></i> copy & paste</small>
            </div>
            <div class="whatsapp-msg" id="whatsappPreview">
                <div class="empty-state">Fill in the fields and click "Generate Preview"</div>
            </div>
            <button class="copy-btn" id="copyBtn"><i class="fas fa-copy"></i> Copy to Clipboard</button>
            <div class="footer-hint"><i class="fas fa-edit"></i> all fields start empty — fill & generate</div>
        </div>
    </div>

    <script>
        (function() {
            const generateBtn = document.getElementById('generateBtn');
            const clearBtn = document.getElementById('clearBtn');
            const previewDiv = document.getElementById('whatsappPreview');
            const copyBtn = document.getElementById('copyBtn');

            function getVal(id) {
                const el = document.getElementById(id);
                return el ? el.value.trim() : '';
            }

            function buildMessage() {
                const date = getVal('dateInput');
                const greeting = getVal('greetingInput');
                const compressors = getVal('compressors');
                const holes = getVal('holes');
                const feetage = getVal('feetage');
                const prodFtd = getVal('prodFtd');
                const prodMtd = getVal('prodMtd');
                const todayPlan = getVal('todayPlan');
                const boulderTrips = getVal('boulderTrips');
                const bFtd = getVal('boulderFtd');
                const bMtd = getVal('boulderMtd');
                const plantTripsFtd = getVal('plantTripsFtd');
                const plantFtd = getVal('plantFtd');
                const plantMtd = getVal('plantMtd');
                const plantTph = getVal('plantTph');
                const dFtd = getVal('dispatchFtd');
                const dMtd = getVal('dispatchMtd');
                const basicFtd = getVal('basicFtd');
                const basicMtd = getVal('basicMtd');
                const totalFtd = getVal('totalFtd');
                const totalMtd = getVal('totalMtd');
                const royalty = getVal('royalty');
                const remarks = getVal('remarksInput');

                // Check if any data is entered
                const hasData = date || greeting || compressors || holes || feetage || prodFtd || prodMtd || 
                               todayPlan || boulderTrips || bFtd || bMtd || plantTripsFtd || plantFtd || 
                               plantMtd || plantTph || dFtd || dMtd || basicFtd || basicMtd || totalFtd || 
                               totalMtd || royalty || remarks;

                if (!hasData) {
                    return '<div class="empty-state">Fill in the fields and click "Generate Preview"</div>';
                }

                // Calculate next day for "Today planning"
                let nextDate = '';
                if (date) {
                    const parts = date.split('-');
                    if (parts.length === 3) {
                        let day = parseInt(parts[0], 10);
                        let month = parseInt(parts[1], 10);
                        let year = parts[2];
                        if (!isNaN(day) && !isNaN(month)) {
                            day = day + 1;
                            if (day > 31) { day = 1;
                                month++; }
                            if (month > 12) { month = 1; }
                            nextDate = String(day).padStart(2, '0') + '-' + String(month).padStart(2, '0') + '-' + year;
                        } else {
                            nextDate = date;
                        }
                    } else {
                        nextDate = date;
                    }
                }

                // Parse today plan
                let planBullets = '';
                if (todayPlan) {
                    const planParts = todayPlan.split('·').map(p => p.trim()).filter(p => p);
                    if (planParts.length >= 3) {
                        const cMatch = planParts[0].match(/Compressors?\s*[:]\s*(.+)/i);
                        const hMatch = planParts[1].match(/Holes?\s*[:]\s*(.+)/i);
                        const fMatch = planParts[2].match(/Feetage?\s*[:]\s*(.+)/i);
                        const c = cMatch ? cMatch[1].trim() : planParts[0];
                        const h = hMatch ? hMatch[1].trim() : planParts[1];
                        const f = fMatch ? fMatch[1].trim() : planParts[2];
                        planBullets = `Compressors : ${c}\nHoles :  ${h}\nFeetage : ${f}`;
                    } else {
                        const cMatch = todayPlan.match(/Compressors?\s*[:]\s*([^\·]+)/i);
                        const hMatch = todayPlan.match(/Holes?\s*[:]\s*([^\·]+)/i);
                        const fMatch = todayPlan.match(/Feetage?\s*[:]\s*([^\·]+)/i);
                        const c = cMatch ? cMatch[1].trim() : '';
                        const h = hMatch ? hMatch[1].trim() : '';
                        const f = fMatch ? fMatch[1].trim() : '';
                        if (c || h || f) {
                            planBullets = `Compressors : ${c || '___'}\nHoles :  ${h || '___'}\nFeetage : ${f || '___'}`;
                        } else {
                            planBullets = todayPlan;
                        }
                    }
                }

                // Build message with fixed units - only show fields that have values
                let msg = '';

                // Greeting and Date
                if (greeting || date) {
                    if (greeting) msg += `*${greeting},* \n`;
                    if (date) msg += `DATE ${date}. \n`;
                    msg += '\n';
                }

                // Mine Operations
                const hasMineOps = compressors || holes || feetage || prodFtd || prodMtd;
                if (hasMineOps) {
                    msg += `*Mine Operations* \n`;
                    if (compressors) msg += `Compressors : ${compressors}\n`;
                    if (holes) msg += `Holes : ${holes}\n`;
                    if (feetage) msg += `Feetage : ${feetage}\n`;
                    if (prodFtd) msg += `Production FTD : ${prodFtd} MT\n`;
                    if (prodMtd) msg += `Production MTD : ${prodMtd} MT\n`;
                    msg += '\n';
                }

                // Today Planning
                if (todayPlan && (planBullets || todayPlan)) {
                    msg += `*Today planning* (${nextDate || '___'}) \n`;
                    msg += `${planBullets || todayPlan}\n\n`;
                }

                // Boulders Dispatch
                const hasBoulders = boulderTrips || bFtd || bMtd;
                if (hasBoulders) {
                    msg += `*Boulders Dispatch Qty :* \n`;
                    if (boulderTrips) msg += `Total Trips : ${boulderTrips}\n`;
                    if (bFtd) msg += `*FTD : ${bFtd} MT* \n`;
                    if (bMtd) msg += `*MTD : ${bMtd} MT* \n`;
                    msg += '\n';
                }

                // Plant production
                const hasPlant = plantTripsFtd || plantFtd || plantMtd || plantTph;
                if (hasPlant) {
                    msg += `*Plant production :*\n`;
                    if (plantTripsFtd) msg += `*FTD Trips : ${plantTripsFtd}* \n`;
                    if (plantFtd) msg += `*FTD   :   ${plantFtd} MT* \n`;
                    if (plantMtd) msg += `*MTD  :   ${plantMtd} MT* \n`;
                    if (plantTph) msg += `*TPH :  ${plantTph}* \n`;
                    msg += '\n';
                }

                // Dispatch Qty
                const hasDispatch = dFtd || dMtd;
                if (hasDispatch) {
                    msg += `*Dispatch Qnty :*\n`;
                    if (dFtd) msg += `*FTD :  ${dFtd} MT* \n`;
                    if (dMtd) msg += `*MTD :  ${dMtd} MT*\n`;
                    msg += '\n';
                }

                // Revenue
                const hasRevenue = basicFtd || basicMtd || totalFtd || totalMtd;
                if (hasRevenue) {
                    if (basicFtd || basicMtd) {
                        msg += `*Basic revenue :* \n`;
                        if (basicFtd) msg += `*FTD :  ${basicFtd} L*  \n`;
                        if (basicMtd) msg += `*MTD :  ${basicMtd} L* \n`;
                        msg += '\n';
                    }
                    if (totalFtd || totalMtd) {
                        msg += `*Total Revenue :* \n`;
                        if (totalFtd) msg += `*FTD :  ${totalFtd} L*\n`;
                        if (totalMtd) msg += `*MTD : ${totalMtd} L*\n`;
                        msg += '\n';
                    }
                }

                // Royalty
                if (royalty) {
                    msg += `*Royalty :*\n`;
                    msg += `*${royalty} MT* \n\n`;
                }

                // Remarks
                if (remarks) {
                    msg += `*Remarks :* \n`;
                    msg += `${remarks}`;
                }

                // If nothing was added, show empty state
                if (!msg.trim()) {
                    return '<div class="empty-state">Fill in the fields and click "Generate Preview"</div>';
                }

                return msg;
            }

            function updatePreview() {
                const text = buildMessage();
                if (text.includes('empty-state')) {
                    previewDiv.innerHTML = text;
                } else {
                    previewDiv.textContent = text;
                }
            }

            // Generate on button click
            generateBtn.addEventListener('click', updatePreview);

            // Clear all fields
            clearBtn.addEventListener('click', function() {
                const inputs = document.querySelectorAll('#reportForm input, #reportForm textarea');
                inputs.forEach(inp => {
                    inp.value = '';
                });
                updatePreview();
            });

            // Auto-update on input change (optional, but we'll keep it for convenience)
            const inputs = document.querySelectorAll('#reportForm input, #reportForm textarea');
            inputs.forEach(inp => {
                inp.addEventListener('input', updatePreview);
            });

            // Copy to clipboard
            copyBtn.addEventListener('click', function() {
                let text = previewDiv.textContent;
                // Check if it's the empty state message
                if (previewDiv.querySelector('.empty-state')) {
                    text = 'Please fill in the fields first.';
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                        copyBtn.classList.add('copied');
                        setTimeout(() => {
                            copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy to Clipboard';
                            copyBtn.classList.remove('copied');
                        }, 2200);
                    }).catch(() => {
                        fallbackCopy(text);
                    });
                } else {
                    fallbackCopy(text);
                }
            });

            function fallbackCopy(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                    copyBtn.classList.add('copied');
                    setTimeout(() => {
                        copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy to Clipboard';
                        copyBtn.classList.remove('copied');
                    }, 2200);
                } catch (e) {
                    alert('Could not copy. Please select the text manually.');
                }
                document.body.removeChild(textarea);
            }

            // Initial empty state
            updatePreview();
        })();
    </script>
</body>
</html>
